<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Moon 的 app 图标（SVG 源，也是 favicon）。

    月牙的形状**不是**手画的，是从 pen 画布 `空状态 — 首次进入` 那帧里取的原始 path
    （画布里那个收尖的月牙），只做了平移 + 等比缩放：
      原始 bbox  x=0 y=0 w=59.7313 h=68.1335  →  中心 (29.86566, 34.06675)
      变换        translate(512 512) scale(8.5128) translate(-29.86566 -34.06675)
      结果        月牙 508.5 × 580，居中；bbox 四角距中心 385.7 < 409.6（maskable 安全圈半径）
                  所以 580 基本是这个安全圈内的最大高度，再大就会被 Android 的自适应遮罩切到

    「圆减圆」拼出来的月牙两头是钝的，所以这里用画布那条 path。

    底色是满幅方形（不切圆角）：
      - apple-touch-icon 和 maskable 图标必须满幅，否则被系统遮罩一裁就露透明角
      - `any` 用途下各平台自己会套圆角
    PNG 由这个文件栅格化而来，改图标只改这里，然后重跑栅格化。
  -->
  <rect width="1024" height="1024" fill="#FAF8F6" />
  <g transform="translate(512 512) scale(8.5128) translate(-29.86566162109375 -34.066745936870575)">
    <path
      fill="#E4576B"
      d="M32.87351 0c-19.00601 0-32.87351 17.501-32.87351 35.6685 0 19.049 13.803 32.465 32.2285 32.465 14.7275 0 25.198-9.6535 27.43401-15.265 0.258-0.731-0.2365-1.28999-1.032-1.0535-3.39701 1.462-7.353 2.1285-10.81451 2.1285-14.835 0-25.714-11.5025-25.714-25.4345 0-12.255 8.04101-22.3815 18.2105-26.058 0.86-0.4085 0.7095-1.247-0.215-1.462-2.4725-0.7095-4.8805-0.989-7.22399-0.989z"
    />
  </g>
</svg>